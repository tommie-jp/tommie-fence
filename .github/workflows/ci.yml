name: CI

# GitHub がワークフローを読むのはリポジトリ直下の .github/workflows だけ。
# 取り込んだ packages/*/.github は動かないので、ここに 1 本化してある。
on:
  push:
    branches: [main]
  pull_request:

# 読むだけ。release.yml / pages.yml と同じく、既定の token の権限に頼らない。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # 片方が落ちても、もう片方の結果は見たい。
      fail-fast: false
      matrix:
        include:
          # fence-kit は束ねる工程を持たないので、型チェックとテストだけ。
          - pkg: fence-kit
            pack: false
            build: false
            docs: false
            generated: ""
          # 配る 1 つ。図は作らないが、**束ねられることは見る** —
          # ここが壊れると `.vsix` が作れない (52 の docs/19)。
          - pkg: tommie-fence
            pack: false
            build: true
            docs: false
            generated: ""
          # 3 つのフェンスを 1 つの頁で動かす。全部を import する唯一の場所。
          - pkg: playground
            pack: false
            build: true
            docs: false
            generated: ""
          # 生成物のうち、どの環境でも同じバイト列になるものだけ差分を見る。
          # circuit-fence: SVG は node-tikzjax の版で、PNG はフォント環境で変わる。
          # breadboard-fence: SVG は決まるが、PNG はフォントの描画で変わる。
          - pkg: circuit-fence
            pack: true
            build: true
            docs: true
            generated: "'packages/circuit-fence/examples/out/*.tex' 'packages/circuit-fence/docs/out/*.tex'"
          - pkg: breadboard-fence
            pack: true
            build: true
            docs: false
            generated: "'packages/breadboard-fence/examples/out/*.svg'"
          # perfboard-fence: SVG は決まる。docs にも図があるので両方作り直す。
          - pkg: perfboard-fence
            pack: true
            build: true
            docs: true
            generated: "'packages/perfboard-fence/examples/out/*.svg' 'packages/perfboard-fence/docs/out/*.svg'"
    name: check (${{ matrix.pkg }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # lock はリポジトリ直下の 1 本だけ (npm workspaces)。
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace=${{ matrix.pkg }}
      - run: npm test --workspace=${{ matrix.pkg }}
      # **束ねられることも見る。** 型チェックもテストも `esbuild.mjs` を通らない
      # ので、ここが無いと壊れたビルドが素通りする (実際に踏んだ)。
      - if: matrix.build
        run: npm run build --workspace=${{ matrix.pkg }}
      - if: matrix.generated != ''
        run: npm run examples --workspace=${{ matrix.pkg }}
      - if: matrix.docs
        run: npm run docs --workspace=${{ matrix.pkg }}
      # 差分が出たら、図の作り直しをコミットし忘れている。
      - if: matrix.generated != ''
        run: git diff --exit-code -- ${{ matrix.generated }}
      # **配る形も見る。** 型チェックもテストも `npm run build` も `npm pack` を
      # 通らないので、ライブラリの出口が壊れていても素通りする。実際、型の
      # 書き出し (prepack) は 2026-09-03 から落ちていたのに 3 週間気づけなかった
      # (52 の docs/56)。見るのは tgz の中身そのもの。
      - if: matrix.pack
        name: tgz の中身を確かめる (ライブラリのとき)
        run: |
          npm pack --workspace=${{ matrix.pkg }} --pack-destination "$RUNNER_TEMP"
          tgz="$RUNNER_TEMP/${{ matrix.pkg }}-$(node -p "require('./packages/${{ matrix.pkg }}/package.json').version").tgz"
          tar tzf "$tgz" > "$RUNNER_TEMP/files.txt"
          for want in package/dist/core.mjs package/dist/core.cjs package/dist/types/index.d.ts; do
            grep -qx "$want" "$RUNNER_TEMP/files.txt" || { echo "tgz に $want がない" >&2; exit 1; }
          done
          # ソースは配らない (.npmignore)。入ると 13 MB になる。
          if grep -q '^package/src/' "$RUNNER_TEMP/files.txt"; then
            echo "tgz に src/ が入っている (.npmignore が効いていない)" >&2
            exit 1
          fi
          # **型は 1 ファイルに束ねる。** fence-kit は tgz に入らないので、
          # `from 'fence-kit'` が残ると使う側で解決できない。`skipLibCheck: true`
          # の使い手では**黙って any に落ちる**ので、ここで見ないと気づけない。
          tar xzf "$tgz" -C "$RUNNER_TEMP" package/dist/types/index.d.ts
          if grep -nE "from '[^.]" "$RUNNER_TEMP/package/dist/types/index.d.ts" | grep -v "from 'yaml'"; then
            echo "型定義が yaml 以外の素の import を持っている" >&2
            exit 1
          fi

  # **拡張を本物の VS Code の中で試す** (52 の docs/57)。単体試験は vscode を
  # スタブにしているので、有効化・manifest の綴り・webview が立つか・Problems に
  # 載るかは、ここでしか見えない。デスクトップ (Electron) と web (Chromium) の両方。
  e2e:
    runs-on: ubuntu-latest
    name: e2e (tommie-fence)
    # test-web はブラウザを立てられないと、終わらずに待ち続ける (実際に 20 分止まった)。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # VS Code (stable) を落として立てる。画面が無いので仮の画面の中で。
      - run: xvfb-run -a npm run test:e2e --workspace=tommie-fence
      # **manifest が言う下限でも回す** (engines.vscode)。書いた下限を一度も
      # 確かめていなかったので、1.75 と書いたままマップが開かなかった (52 の docs/57)。
      - name: test:e2e (engines.vscode の下限)
        run: |
          VSCODE_TEST_VERSION="$(node -p "require('./packages/tommie-fence/package.json').engines.vscode.replace(/^\\^/, '')")" \
            xvfb-run -a npm run test:e2e --workspace=tommie-fence
      # web 版は `@vscode/test-web` をその場で取る (Chromium を落とす依存を持つので、
      # devDependencies に入れると全 job の npm ci が Chromium を落とす)。
      # **ブラウザは test-web が抱える playwright で入れる** (版が揃う)。npx で入れた
      # だけでは落ちてこない。OS の依存もここで (--with-deps)。
      - run: npx -y -p @vscode/test-web@0.0.81 -- playwright install --with-deps chromium
      - run: npm run test:web --workspace=tommie-fence
        timeout-minutes: 10
