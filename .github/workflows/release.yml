name: Release

# タグを打つのがリリースの合図。バージョンの出所を package.json とタグの 2 つに
# 分けないよう、両者の一致を確かめてからパッケージする。
#
# モノレポなので、タグはどのパッケージの版かを名前で表す:
#   tommie-fence-v0.1.0 (拡張。`.vsix` が付く)
#   circuit-fence-v0.5.0 (ライブラリ + CLI。tgz が付く)
#   fence-kit-v0.1.0 (殻を他の宿主で動かす出口。tgz が付く)
# (旧リポジトリの `v0.3.0` 形式のタグは、archive したあちらに残る)
on:
  push:
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # **24 で詰める。** `.vsix` は作業場で `npm install --install-links`
          # を通すが、npm 10 (Node 22) は入れ子の `file:` 依存でここが落ちる
          # (`Cannot read properties of null (reading 'edgesOut')`)。
          # 手元 (npm 11) では通っていて、CI だけが落ちていた。
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: タグからパッケージと版を取り出し、package.json と一致することを確かめる
        run: |
          tag="$GITHUB_REF_NAME"
          pkg="${tag%-v*}"
          ver="${tag##*-v}"
          if [ ! -d "packages/$pkg" ]; then
            echo "タグ $tag のパッケージ $pkg が packages/ にない" >&2
            exit 1
          fi
          have="$(node -p "require('./packages/$pkg/package.json').version")"
          if [ "$have" != "$ver" ]; then
            echo "タグ $tag と packages/$pkg/package.json の $have が食い違っている" >&2
            exit 1
          fi
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "VER=$ver" >> "$GITHUB_ENV"
          # **拡張は 1 つだけ** (52 の docs/19 で 3 つを畳んだ)。ほかは
          # ライブラリ + CLI なので `.vsix` が無く、版だけを切る。
          if node -p "!!require('./packages/$pkg/package.json').contributes" | grep -q true; then
            echo "VSIX=1" >> "$GITHUB_ENV"
          else
            echo "VSIX=" >> "$GITHUB_ENV"
          fi
          # ライブラリは tgz を添える。**配る形を持つものだけ** — 目印は
          # prepack (ビルドと型の書き出しをする段取り。52 の docs/56)。
          # 3 つのコアと fence-kit が持つ。fence-kit の tgz に入るのは殻を
          # 他の宿主で動かす出口 (`./shell` と `./map.web.js`) だけで、本体の
          # `"."` はモノレポの中で src のまま束ねられる (52 の docs/59)。
          if node -p "!!require('./packages/$pkg/package.json').scripts.prepack" | grep -q true; then
            echo "TGZ=1" >> "$GITHUB_ENV"
          else
            echo "TGZ=" >> "$GITHUB_ENV"
          fi
          # 図を作り直す口があるか (`examples` を持たないパッケージもある)。
          if node -p "!!require('./packages/$pkg/package.json').scripts.examples" | grep -q true; then
            echo "FIGURES=1" >> "$GITHUB_ENV"
          else
            echo "FIGURES=" >> "$GITHUB_ENV"
          fi

      # doBuild.sh が型チェックとテストを通してから、作業場へ写して .vsix を作る。
      # (workspaces の巻き上げのまま vsce を呼ぶと同じパスを 2 度拾って止まるため)
      - name: .vsix を作る (拡張のときだけ)
        if: env.VSIX
        run: |
          ./doBuild.sh "$PKG" --no-install
          cd "packages/$PKG"
          test -f "$PKG-$VER.vsix"
          sha256sum "$PKG-$VER.vsix" > SHA256SUMS

      # ライブラリは `.vsix` の代わりに tgz を配る。npm レジストリには出して
      # いないので、使う側 (41 の QR ノートなど) は Release から落として
      # `vendor/` に置く。**どの版かがタグと綴りで一意になる** (52 の docs/56)。
      # `npm pack` が prepack を呼ぶので、束ねと型の書き出しもここで通る。
      - name: tgz を作る (ライブラリのとき)
        if: env.TGZ
        run: |
          npm pack --workspace="$PKG" --pack-destination "packages/$PKG"
          cd "packages/$PKG"
          test -f "$PKG-$VER.tgz"
          sha256sum "$PKG-$VER.tgz" > SHA256SUMS

      - name: 生成物が作り直し済みか確かめる
        if: env.FIGURES
        run: |
          npm run examples --workspace="$PKG"
          case "$PKG" in
            circuit-fence)
              # SVG は node-tikzjax の版で、PNG はフォント環境で変わる。
              npm run docs --workspace="$PKG"
              git diff --exit-code -- \
                "packages/$PKG/examples/out/*.tex" "packages/$PKG/docs/out/*.tex"
              ;;
            perfboard-fence|copper-fence|vna-fence)
              npm run docs --workspace="$PKG"
              git diff --exit-code -- \
                "packages/$PKG/examples/out/*.svg" "packages/$PKG/docs/out/*.svg"
              ;;
            *)
              git diff --exit-code -- "packages/$PKG/examples/out/*.svg"
              ;;
          esac

      - name: CHANGELOG から該当バージョンの節を抜き出す
        run: |
          cd "packages/$PKG"
          extract() {
            awk -v head="$1" '
              $0 ~ "^## \\[" head "\\]" { found = 1; next }
              /^## \[/ { found = 0 }
              found' CHANGELOG.md
          }
          extract "$VER" > notes.md
          # 版の節をまだ切っていなければ Unreleased で出す
          # (タグを打った後にここで落ちると、リリースだけが無い状態になるため)。
          if ! grep -q '[^[:space:]]' notes.md; then extract Unreleased > notes.md; fi
          # どちらも空なら、書くことが無いままリリースしない。
          grep -q '[^[:space:]]' notes.md
          # 入れ方・使い方を毎回添える (CHANGELOG には書かない。リリースのページで要るため)。
          if [ -n "$VSIX" ]; then extra=vsix; elif [ -n "$TGZ" ]; then extra=tgz; else extra=; fi
          if [ -n "$extra" ]; then
            sed -e "/markdownlint-disable/d" -e "s/{{VER}}/$VER/g" -e "s/{{PKG}}/$PKG/g" -e "s/{{TAG}}/$GITHUB_REF_NAME/g" \
              "$GITHUB_WORKSPACE/.github/release-notes/$extra.md" >> notes.md
          fi

      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "packages/$PKG"
          # 拡張なら `.vsix`、ライブラリなら tgz を添える。どちらも SHA256SUMS つき。
          if [ -n "$VSIX" ]; then
            gh release create "$GITHUB_REF_NAME" \
              "$PKG-$VER.vsix" SHA256SUMS \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          elif [ -n "$TGZ" ]; then
            gh release create "$GITHUB_REF_NAME" \
              "$PKG-$VER.tgz" SHA256SUMS \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
