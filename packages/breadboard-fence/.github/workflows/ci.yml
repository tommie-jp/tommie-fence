name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # examples/out の SVG はスナップショットなので、
      # 描き直して差分が出たらコミットし忘れ。
      - run: npm run examples
      - run: git diff --exit-code -- examples/out
