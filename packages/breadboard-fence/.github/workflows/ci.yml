name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run examples
      # SVG はどの環境でも同じバイト列になるので、差分が出たらコミットし忘れ。
      # PNG はフォントの描画が環境で変わるため一致を求めない。
      - run: git diff --exit-code -- 'examples/out/*.svg'
