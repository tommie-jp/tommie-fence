source: "秋月の Si5351A モジュール (型番 AE-Si5351A-B、販売コード 110679)。10 mm 角の基板に 2.54 mm ピッチの穴が 4 個ずつ 2 列 (列の間 7.62 mm) で、**DIP8 と同じ形**。秋月の説明書 https://akizukidenshi.com/goodsaffix/AE-Si5351A.PDF の端子説明の表と基板図 (2026-11-12 に確かめた): 1 VDDO・2 SCL・3 SDA・4 GND・5 CLK0・6 CLK1・7 CLK2・8 VDD。基板図のシルクは左の列が上から VDDO SCL SDA GND、右の列が上から VDD CLK2 CLK1 CLK0 で、番号は DIP と同じ回り方。 レギュレータもレベル変換もプルアップも載っていない (回路図は IC・水晶・0.1 µF 2 個だけ)。"
