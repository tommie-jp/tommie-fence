# 同梱の部品カード (52 の docs/160 で TS の表から移した)。
# ロータリーエンコーダ単体 (EC11 など) は 5 mm ピッチのピンで穴に挿せない。ブレッドボードに挿すのは
# 5 ピンのモジュール (KY-040)。ヘッダは基板の右の辺にあり、印字の読める向きで奥から CLK DT SW + GND
# (GND が取付穴の側の角)。部品面を上にしてピンを手前に向けると、左から GND + SW DT CLK。
# `+` は `VCC` と書く (2026-10-22 に Joy-IT の SensorKit の写真と接続表で確かめた。2026-10-07 の
# 「ピンを手前にして左から CLK…」は左右が逆だった)。
# 描くのは基板のピンヘッダだけ (緑の帯)。
models: [KY-040, KY040]
package: sip5
role: ロータリーエンコーダのモジュール
role-en: rotary encoder module
pins: [CLK, DT, SW, VCC, GND]
look:
  body: "#2f7d4f"
  edge: "#1d5434"
note: ロータリーエンコーダのモジュール。基板のピンヘッダだけを緑の帯で描く。印字の `+` は `VCC`。CLK=A 相、DT=B 相、SW=押しボタン。部品面を上にしてピンを手前に向けると、左から `GND` `VCC` `SW` `DT` `CLK`
source: ロータリーエンコーダ単体 (EC11 など) は 5 mm ピッチのピンで穴に挿せない。ブレッドボードに挿すのは 5 ピンのモジュール (KY-040)。ヘッダは基板の右の辺にあり、印字の読める向きで奥から CLK DT SW + GND (GND が取付穴の側の角)。部品面を上にしてピンを手前に向けると、左から GND + SW DT CLK。 `+` は `VCC` と書く (2026-10-22 に Joy-IT の SensorKit の写真と接続表で確かめた。2026-10-07 の 「ピンを手前にして左から CLK…」は左右が逆だった)。 描くのは基板のピンヘッダだけ (緑の帯)。
