source: "秋月の 3.5 mm ステレオミニジャック DIP 化キット (キット 105363、基板 105707、AE-PHONE-JACK-DIP)。 秋月の基板図 (AE-PHONE-JACK-DIP.pdf、2016-03-01): 18 mm 角、ピンは縁から 1.34 mm に縦 1 列 4 本で、シルクは 上から R G G L (G はスリーブ = GND)。切替の端子はピンに出ていない。ジャックの口はピンと反対の縁から出る。 ジャックの胴は写真から取った目安で、幅 6 mm、列から 4〜18 mm。"
