note: "秋月の 2.1 mm DC ジャック DIP 化キット。1 列だけにヘッダを立てる。1 番 `GND` (シルク −)・4 番 `VIN` (シルク +、中心ピン)。2・3 番は使わない (番号で呼ぶ)。銀の帯で描き、キットの基板とジャックを帯の脇へ描く (胴の寸法は目安)。**実物で確かめる: 秋月の図は線画だけで、2・3 番がどちらにつながるかは読み取れない。シルクのある 1 番 (−) と 4 番 (+) だけを使い、実物はテスタで確かめる**"
source: "秋月のブレッドボード用 2.1 mm 標準 DC ジャック DIP 化キット (キット 105148、完成品 114610、AE-DC-POWER-JACK-DIP)。 基板は 15.24 mm 角で、4 穴の列が 2 本 (間隔 12.7 mm)。列は基板の縁から 1.27 mm。**1 列だけにヘッダを立てて使う** (キットに 1×4 の細ピンヘッダ。通常のピンヘッダは穴に入らない)。シルクは列の端に − (1 番) と + (4 番)。 ジャックは中心ピンが + (シンガトロン 2DC-0005X100 Rev T1 の #1 PIN の長穴が + の島)。秋月の基板図 (ae-dc-power-jack-dip.pdf、2019-04-15) は線画だけで、2・3 番のつながりは読み取れない (52 の docs/140)。 ジャックの胴は写真から取った目安で、幅 9 mm、列から 3〜16 mm (口が奥の縁を越える)。"
