source: 秋月の LAN コネクターDIP化キット (販売コード 105404、キットの型番 AE-RJ-45-LAN-DIP-A-KIT)。 変換基板 (AE-RJ-45-LAN-DIP-A、25.36 × 15 mm) に RJ45 のジャックが載り、2.54 mm の 1 列 8 本 (CN2) が 基板の一辺の縁に出る。パルストランスは無い (素の信号が出る)。 秋月の資料 https://akizukidenshi.com/goodsaffix/AE-RJ-45-LAN-DIP-A.pdf は基板の図だけで、 ピンの番号は書かれていない。**ヘッダの 1〜8 番がジャックの 1〜8 番に一対一で並ぶ前提** (2026-10-19。実物は導通で確かめる)。名前は数字だけだと番号と割れるので `P1`〜`P8`。 ヘッダは銀の帯。基板 (25.36 × 15 mm、資料の外形図) とジャックの胴を、帯の脇の基板の縁に近い側へ描く。 ヘッダの列は基板の手前の縁から 1.27 mm (資料の穴の位置からの目安)。胴は写真から取った目安で、 幅 16 mm、列から 2.5〜15 mm (基板の奥の縁を 1.27 mm 越えて口が出る)。
