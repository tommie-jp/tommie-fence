# ヘッダに載った基板と胴 (outline:)。寸法は mm。
models:
  - AE-DC-POWER-JACK-DIP
  - AE-DC-POWER-JACK-DIP-KIT
  - "105148"
  - "114610"
package: sip4
role: 2.1 mm DC ジャックの DIP 化キット
pins:
  - GND
  - NC
  - NC
  - VIN
look:
  body: "#b9bec5"
  edge: "#7a8089"
outline:
  along: 15.24
  across: 15.24
  inset: 1.27
  jack:
    along: 9
    from: 3
    to: 16
  mark: DC
note: "`sip4` を銀の帯で描き、キットの基板とジャックを帯の脇へ描く (胴の寸法は目安)。1 番 `GND` (シルク −)・4 番 `VIN` (シルク +、中心ピン)。2・3 番は使わない (番号で呼ぶ)。**実物で確かめる: 秋月の図は線画だけで、2・3 番がどちらにつながるかは読み取れない。シルクのある 1 番 (−) と 4 番 (+) だけを使い、実物はテスタで確かめる**"
source: 秋月の基板図 ae-dc-power-jack-dip.pdf (2019-04-15)、シンガトロン 2DC-0005X100 Rev T1 (中心ピンが +)。ジャックの胴の寸法は写真から取った目安
