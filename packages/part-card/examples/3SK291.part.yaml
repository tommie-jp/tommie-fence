# 面実装しか無い部品を変換基板に載せた姿 (smd:)。寸法は mm。
models:
  - 3SK291
package: dip4
role: デュアルゲート MOSFET (N)
pins:
  - G1
  - G2
  - D
  - S
smd:
  length: 2.9
  width: 1.5
  span: 2.9
  pitch: 1.9
  lead: 0.4
  wide:
    pin: 4
    lead: 0.6
  mark: U.F
source: 東芝 3SK291 (2014-03-01)、外形図の端子の番号 (SMQ。1 G1・2 G2・3 D・4 S)。変換基板が SMQ の番号をそのまま DIP の番号にしている前提
