# 1 列のモジュール (sipN)。look: で基板の色を決める。
models:
  - HC-SR04
  - HCSR04
package: sip4
role: 超音波距離センサのモジュール
pins:
  - VCC
  - TRIG
  - ECHO
  - GND
look:
  body: "#2b6cb0"
  edge: "#1c4a7d"
note: "`sip4` を青の帯で描く (基板のピンヘッダだけ)。センサの筒の面から見て左から VCC TRIG ECHO GND (裏から見ると逆)。Echo は 5 V 出力"
source: "秋月 111009 の付属資料 (HC-SR04 用户手册 V-2020: 1 Vcc 2 Trig 3 Echo 4 Gnd、外形図は裏から見て逆)・ElecFreaks・Cytron V1.0 (2026-10-22 に確かめた)"
